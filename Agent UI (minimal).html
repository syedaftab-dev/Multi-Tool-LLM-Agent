<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent</title>
<style>
:root{
  --bg:#F5F3EE;--panel:#FBFAF7;--ink:#1A1A17;--mute:#77746B;--line:#E2DED4;--accent:#1F5C4B;--accent-ink:#fff;--chip:#ECE9E0;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--panel:#1B1B19;--ink:#ECEAE3;--mute:#8F8C82;--line:#2C2C29;--accent:#6FC3A5;--accent-ink:#0F1A15;--chip:#242421}}
:root[data-theme="dark"]{--bg:#141413;--panel:#1B1B19;--ink:#ECEAE3;--mute:#8F8C82;--line:#2C2C29;--accent:#6FC3A5;--accent-ink:#0F1A15;--chip:#242421}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:232px 1fr;height:100%;max-width:1200px;margin:0 auto}
aside{border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;font-weight:600;font-size:16px}
.mark{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.mark svg{width:15px;height:15px;stroke-width:2}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px;border-radius:8px;color:var(--ink);min-height:40px;position:relative}
.item:hover{background:var(--chip)}
.item.active{background:var(--chip);font-weight:500}
.item.new{border:1px solid var(--line);margin-bottom:10px}
.item .del{margin-left:auto;opacity:0.7;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;min-width:26px;flex-shrink:0;border-radius:6px;color:var(--mute);padding:0}
.item:hover .del{opacity:0.95}
.item .del:hover{opacity:1;background:rgba(239,68,68,0.18);color:#ef4444}
.label{font-size:12px;color:var(--mute);padding:14px 8px 4px;letter-spacing:.04em;text-transform:uppercase}
.item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.tool{cursor:default;color:var(--mute)}
.tool:hover{background:none}
.dot{margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.spacer{flex:1}
main{display:flex;flex-direction:column;min-width:0;height:100%}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;color:var(--mute);font-size:13px}
.model{border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--ink)}
.status{display:flex;align-items:center;gap:8px}
.status i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
#scroll{flex:1;overflow-y:auto;padding:0 28px}
.col{max-width:720px;margin:0 auto}
.hero{padding:9vh 0 28px}
h1{font-size:clamp(28px,4.4vw,40px);font-weight:600;letter-spacing:-.02em;line-height:1.15}
.sub{color:var(--mute);margin-top:10px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:28px}
.card{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card b{font-weight:600}
.card small{color:var(--mute);font-size:13px}
.card code{font:12px ui-monospace,Menlo,monospace;background:var(--chip);padding:2px 6px;border-radius:5px;width:fit-content;color:var(--ink)}
.msgs{padding:24px 0;display:flex;flex-direction:column;gap:18px}
.m{max-width:85%;padding:10px 14px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}
.m.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.m.a{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.tag{display:block;font-size:11px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.composer{padding:12px 28px calc(16px + 0px)}
.box{max-width:720px;margin:0 auto;display:flex;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:6px}
.box:focus-within{border-color:var(--accent)}
input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:inherit;padding:8px 10px}
input::placeholder{color:var(--mute)}
input:focus-visible{outline:none}
.send{width:40px;height:40px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.hint{text-align:center;font-size:12px;color:var(--mute);margin-top:8px}
@media (max-width:760px){
  .app{grid-template-columns:1fr}aside{display:none}
  header,#scroll,.composer{padding-left:16px;padding-right:16px}
  .cards{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="mark"><svg viewBox="0 0 24 24"><path d="M12 4v16M4.5 8l15 8M19.5 8l-15 8"/></svg></div>Agent</div>
    <button class="item new" id="newBtn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>New chat</span></button>
    <div class="label">Recent</div>
    <div id="recent"></div>
    <div class="label">Tools</div>
    <div class="item tool"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></svg><span>Calculator</span><i class="dot"></i></div>
    <div class="item tool"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg><span>Tech lookup</span><i class="dot"></i></div>
    <div class="item tool"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Date and time</span><i class="dot"></i></div>
    <div class="spacer"></div>
    <button class="item" id="clearBtn"><svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></svg><span>Clear history</span></button>
  </aside>

  <main>
    <div id="scroll"><div class="col">
      <section class="hero" id="hero">
        <h1>What can I work out for you?</h1>
        <p class="sub">Solve math, look up tech docs, or check the time. I remember everything we've said in this chat.</p>
        <div class="cards">
          <button class="card" data-q="sqrt(144) + 25*3"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M9 12h.01M15 12h.01M9 16h.01M15 16h.01"/></svg><b>Math</b><small>Solve expressions and equations</small><code>sqrt(144) + 25*3</code></button>
          <button class="card" data-q="What is LangGraph?"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/></svg><b>Tech lookup</b><small>Find docs and explain concepts</small><code>What is LangGraph?</code></button>
          <button class="card" data-q="Today's date"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><b>Date and time</b><small>Check the current moment</small><code>Today's date</code></button>
        </div>
      </section>
      <div class="msgs" id="msgs"></div>
    </div></div>
    <div class="composer">
      <div class="box">
        <input id="inp" placeholder="Ask about math, tech docs, or the time" aria-label="Message" autocomplete="off">
        <button class="send" id="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
      <div class="hint">Press Enter to send</div>
    </div>
  </main>
</div>

<script>
const API_URLS = ["http://localhost:8001", "http://localhost:8000", window.location.origin];
let currentSessionId = "session-" + Date.now();
let chats = JSON.parse(localStorage.getItem("agent_chats") || "[]");

const $ = s => document.querySelector(s);
const msgs = $("#msgs"), scroller = $("#scroll"), hero = $("#hero"), inp = $("#inp");

function saveChats() {
  localStorage.setItem("agent_chats", JSON.stringify(chats));
}

function renderRecent() {
  const container = $("#recent");
  container.innerHTML = "";
  if (chats.length === 0) {
    const empty = document.createElement("div");
    empty.style.color = "var(--mute)";
    empty.style.fontSize = "13px";
    empty.style.padding = "6px 8px";
    empty.textContent = "No recent chats";
    container.appendChild(empty);
    return;
  }
  chats.forEach(chat => {
    const b = document.createElement("div");
    b.className = "item" + (chat.id === currentSessionId ? " active" : "");
    b.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><span></span><button class="del" title="Delete chat"><svg viewBox="0 0 24 24" style="width:14px;height:14px;"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></svg></button>';
    b.querySelector("span").textContent = chat.title;
    b.querySelector("span").onclick = () => loadChat(chat.id);
    b.querySelector(".del").onclick = (e) => {
      e.stopPropagation();
      deleteChat(chat.id);
    };
    container.appendChild(b);
  });
}

function loadChat(id) {
  currentSessionId = id;
  const chat = chats.find(c => c.id === id);
  msgs.innerHTML = "";
  if (!chat || chat.messages.length === 0) {
    hero.style.display = "";
  } else {
    hero.style.display = "none";
    chat.messages.forEach(m => add(m.role === "user" ? "u" : "a", m.content, m.tag));
  }
  renderRecent();
}

function deleteChat(id) {
  chats = chats.filter(c => c.id !== id);
  saveChats();
  if (currentSessionId === id) {
    if (chats.length > 0) {
      loadChat(chats[0].id);
    } else {
      newChat();
    }
  } else {
    renderRecent();
  }
}

function newChat() {
  currentSessionId = "session-" + Date.now();
  msgs.innerHTML = "";
  hero.style.display = "";
  inp.value = "";
  inp.focus();
  renderRecent();
}

function add(cls, text, tag) {
  hero.style.display = "none";
  const d = document.createElement("div");
  d.className = "m " + cls;
  if (tag) {
    const s = document.createElement("span");
    s.className = "tag";
    s.textContent = tag;
    d.appendChild(s);
  }
  d.appendChild(document.createTextNode(text));
  msgs.appendChild(d);
  scroller.scrollTop = scroller.scrollHeight;
  return d;
}

async function callAgentAPI(prompt) {
  for (const url of API_URLS) {
    try {
      const res = await fetch(`${url}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: prompt,
          session_id: currentSessionId,
          model: "openai/gpt-oss-120b",
          temperature: 0.1
        })
      });
      if (res.ok) {
        return await res.json();
      }
    } catch (e) {
      // try next url
    }
  }
  return null;
}

async function ask(q) {
  q = q.trim();
  if (!q) return;

  add("u", q);
  inp.value = "";

  // Update or create chat in storage
  let chat = chats.find(c => c.id === currentSessionId);
  if (!chat) {
    chat = { id: currentSessionId, title: q.slice(0, 22), messages: [] };
    chats.unshift(chat);
  }
  chat.messages.push({ role: "user", content: q });
  saveChats();
  renderRecent();

  // Temporary loading bubble
  const loadingBubble = add("a", "Reasoning with tools...", "AGENT");

  // Call live backend
  const data = await callAgentAPI(q);

  loadingBubble.remove();

  if (data && data.response) {
    let tag = "AGENT";
    if (data.tools_used && data.tools_used.length > 0) {
      tag = data.tools_used[0].toUpperCase();
    }
    add("a", data.response, tag);
    chat.messages.push({ role: "assistant", content: data.response, tag: tag });
    saveChats();
  } else {
    // Local fallback reply
    const reply = "I am powered by Groq and LangGraph. Ensure backend is running (`python -m uvicorn backend.api:app --port 8001`) or access via Streamlit dashboard.";
    add("a", reply, "AGENT");
    chat.messages.push({ role: "assistant", content: reply, tag: "AGENT" });
    saveChats();
  }
}

$("#send").onclick = () => ask(inp.value);
inp.addEventListener("keydown", e => { if (e.key === "Enter") ask(inp.value); });
document.querySelectorAll(".card").forEach(c => c.onclick = () => ask(c.dataset.q));
$("#newBtn").onclick = newChat;
$("#clearBtn").onclick = () => {
  chats = [];
  saveChats();
  newChat();
};
$("#modelBtn").onclick = () => {
  add("a", "Active Provider: Groq Cloud ⚡\nModel: openai/gpt-oss-120b\nTools: Calculator, Knowledge Base, DateTime\nKey: Protected in .env", "MODEL");
};

// Start
renderRecent();
</script>
</body>
</html>
