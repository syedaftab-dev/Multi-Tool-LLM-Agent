<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>FlexyPe Store Diagnostics</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <span class="brand-name">FlexyPe Diagnostics</span>
    </div>
    <button id="rescanBtn" class="icon-btn" title="Re-scan this page">⟳</button>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="store">Store</button>
    <button class="tab" data-tab="products">FlexyPe Products</button>
    <button class="tab" data-tab="disabled">Disabled</button>
    <button class="tab" data-tab="apps">Third-Party Apps</button>
    <button class="tab" data-tab="config">Config</button>
  </nav>

  <main id="content" class="content">
    <div id="loading" class="loading">Scanning storefront…</div>
    <div id="notShopify" class="empty-state hidden">
      <p><strong>This doesn't look like a Shopify storefront.</strong></p>
      <p class="muted">No <code>window.Shopify</code> object or Shopify CDN reference was found on this page.</p>
    </div>

    <section id="panel-store" class="panel hidden"></section>
    <section id="panel-products" class="panel hidden"></section>
    <section id="panel-disabled" class="panel hidden"></section>
    <section id="panel-apps" class="panel hidden"></section>
    <section id="panel-config" class="panel hidden">
      <p class="muted" style="margin-top:0">Bonus: fetch each detected product's backend configuration.</p>
      <div id="configButtons"></div>
      <pre id="configOutput" class="snippet hidden" style="max-height:200px"></pre>
    </section>
  </main>

  <footer class="footer">
    <button id="copyReportBtn" class="footer-btn">Copy JSON report</button>
    <span id="scanMeta" class="scan-meta"></span>
  </footer>

  <script src="config.js"></script>
  <script src="collector.js"></script>
  <script src="detection.js"></script>
  <script src="popup.js"></script>
</body>
</html>
